# Include inside nginx's http {}. The addresses are example loopback ports.
# The Node and Rust listeners must come from the same identified release.
map $request_uri $palmagent_read_path {
    "~^(?<palmagent_read_raw_path>[^?]*)" $palmagent_read_raw_path;
}
# Match the first literal format parameter. Noncanonical percent-encoded queries
# keep the established Node routing rather than guessing at decoded query semantics.
map $args $palmagent_read_transcript {
    default 0;
    ~% 0;
    "~^(?:(?!format=)[^&]*&)*format=transcript(?:&|$)" 1;
}
map "$request_method:$palmagent_read_path:$palmagent_read_transcript" $palmagent_api_upstream {
    default http://127.0.0.1:4000;
    "~^GET:/api/usage:[01]$" http://127.0.0.1:4001;
    "~^GET:/api/tasks/[^/]+/history/(details|steps):[01]$" http://127.0.0.1:4001;
    "~^GET:/api/tasks/[^/]+/history(/changes)?:1$" http://127.0.0.1:4001;
}
# In the existing server/location, change only proxy_pass:
#   proxy_pass $palmagent_api_upstream;
# Keep its TLS, WebSocket upgrade, headers, streaming, timeout and body-size settings.
# Do not configure fallback from the Rust upstream to Node on errors.
