[package]
name = "catalog-experiment"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
members = ["contract"]

[dependencies]
catalog-contract = { path = "contract" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
lto = "thin"
strip = true
panic = "abort"
