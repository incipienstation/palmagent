name: Set up Preview tools
description: Prepare the trusted release tools, source history and repository credential
inputs:
  client-id:
    description: Release App client ID
    required: false
  private-key:
    description: Release App private key
    required: false
outputs:
  token:
    description: Repository-scoped release token
    value: ${{ steps.release-app.outputs.token }}
  slug:
    description: Release App slug
    value: ${{ steps.release-app.outputs.app-slug }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: tooling/.nvmrc
    - name: Check out the latest develop source
      uses: actions/checkout@v4
      with:
        ref: develop
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Create repository-scoped release App token
      if: inputs.client-id != ''
      id: release-app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-actions: write
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: tooling/package.json
    - name: Install release tool dependencies
      shell: bash
      working-directory: tooling
      run: pnpm install --frozen-lockfile --ignore-scripts
