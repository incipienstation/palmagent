name: automatic preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: preview-release
  cancel-in-progress: false
  # Keep the active release; the default single pending run coalesces later pushes.

jobs:
  release:
    if: github.ref == 'refs/heads/develop' && vars.PREVIEW_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check out the latest develop source
        uses: actions/checkout@v4
        with:
          ref: develop
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Create repository-scoped release App token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - name: Prepare, verify, and publish eligible product changes
        run: node tooling/scripts/preview-release.mjs source
        env:
          GH_TOKEN: ${{ vars.RELEASE_APP_CLIENT_ID == '' && github.token || steps.release-app.outputs.token }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_RELEASE_ENABLED: ${{ vars.PREVIEW_RELEASE_ENABLED }}
