name: automatic preview

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: preview-release
  cancel-in-progress: false
  # Keep the active release; the default single pending run coalesces later pushes.

jobs:
  prepare:
    concurrency:
      group: develop-merge
      queue: max
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
      version: ${{ steps.prepare.outputs.version }}
    if: github.ref == 'refs/heads/develop' && vars.PREVIEW_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: ./tooling/.github/actions/preview-setup
        id: setup
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Prepare and merge eligible product changes
        id: prepare
        run: node tooling/scripts/preview-release.mjs source
        env:
          GH_TOKEN: ${{ vars.RELEASE_APP_CLIENT_ID == '' && github.token || steps.setup.outputs.token }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_SLUG: ${{ steps.setup.outputs.slug }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_RELEASE_ENABLED: ${{ vars.PREVIEW_RELEASE_ENABLED }}

  publish:
    needs: prepare
    if: needs.prepare.outputs.commit != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: ./tooling/.github/actions/preview-setup
        id: setup
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Publish the verified preparation
        run: node tooling/scripts/preview-release.mjs source publish
        env:
          GH_TOKEN: ${{ vars.RELEASE_APP_CLIENT_ID == '' && github.token || steps.setup.outputs.token }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_SLUG: ${{ steps.setup.outputs.slug }}
          GH_REPO: ${{ github.repository }}
          PREVIEW_RELEASE_ENABLED: ${{ vars.PREVIEW_RELEASE_ENABLED }}
          PREVIEW_COMMIT: ${{ needs.prepare.outputs.commit }}
          PREVIEW_VERSION: ${{ needs.prepare.outputs.version }}
