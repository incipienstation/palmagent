name: npm publication

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag to retry (exact vX.Y.Z[-alpha.N])
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_REPO: ${{ github.repository }}

jobs:
  inspect:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.identity.outputs.environment }}
      commit: ${{ steps.identity.outputs.commit }}
      sha256: ${{ steps.identity.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download the reviewed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir build/release --pattern '*.tgz' --pattern release.json --pattern SHA256SUMS
      - name: Validate release, artifact, and protected environment
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs check

  publish:
    needs: inspect
    runs-on: ubuntu-latest
    environment: ${{ needs.inspect.outputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install the OIDC-capable npm CLI
        run: npm install --global npm@11.11.1 --ignore-scripts
      - name: Download the same release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir build/release --pattern '*.tgz' --pattern release.json --pattern SHA256SUMS
      - name: Revalidate and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.inspect.outputs.sha256 }}
        run: node scripts/release-publish.mjs publish
