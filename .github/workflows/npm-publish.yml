name: release publication
run-name: Publish ${{ inputs.commit || inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact prepared develop/main commit to publish
        type: string
      candidate_run:
        description: Reuse candidate bytes from a previous run (recovery)
        type: string
      tag:
        description: Legacy retry of an already-public GitHub Release; omit commit
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publication-${{ inputs.commit || inputs.tag }}
  cancel-in-progress: false
  queue: max

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  input:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Require one exact source or legacy tag
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          LEGACY_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            const {SOURCE_COMMIT: commit, LEGACY_TAG: tag, CANDIDATE_RUN: run} = process.env;
            assert(Boolean(commit) !== Boolean(tag), "Supply exactly one commit or legacy tag");
            assert(!commit || /^[a-f0-9]{40}$/.test(commit), "Commit must be a full SHA");
            assert(!tag || /^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag), "Legacy retries support Stable only; Preview requires standalone");
            assert(!run || (commit && /^[1-9][0-9]*$/.test(run)), "Invalid candidate run");
          '

  candidate:
    needs: input
    if: inputs.commit != ''
    uses: ./.github/workflows/release-candidate.yml
    with:
      commit: ${{ inputs.commit }}
      candidate_run: ${{ inputs.candidate_run }}

  publish:
    needs: candidate
    if: inputs.commit != ''
    runs-on: ubuntu-latest
    # This is the single Stable approval, before tag creation, npm publication, or public Release.
    environment: ${{ needs.candidate.outputs.channel == 'next' && 'standalone-preview' || 'npm-latest' }}
    concurrency:
      # A Pages deployment contains both channels. Serialize the complete
      # read/stage/deploy/readback cycle across Preview, Stable and site recovery.
      group: release-pages-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - name: Check out the reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: tooling/.nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          run-id: ${{ needs.candidate.outputs.producer }}
          github-token: ${{ github.token }}
          path: source/build/release
      - name: Install the OIDC-capable npm CLI
        if: needs.candidate.outputs.channel == 'latest'
        run: npm install --global npm@11.11.1 --ignore-scripts
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tooling/package.json
      - name: Install release tool dependencies
        working-directory: tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Finalize the reviewed candidate without rebuilding
        id: finalize
        run: node tooling/scripts/release-finalize.mjs source source/build/release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.candidate.outputs.commit }}
          CANDIDATE_RUN_ID: ${{ needs.candidate.outputs.producer }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.candidate.outputs.sha256 }}
          RELEASE_ENVIRONMENT: ${{ needs.candidate.outputs.channel == 'next' && 'standalone-preview' || 'npm-latest' }}
          STANDALONE_PUBLISH_ENABLED: ${{ vars.STANDALONE_PUBLISH_ENABLED }}
          RELEASE_SIGNING_KEY_ID: ${{ vars.RELEASE_SIGNING_KEY_ID }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
      - name: Build the release Pages site from the staged channel snapshot
        if: steps.finalize.outputs.pages_commit != ''
        run: node tooling/scripts/release-pages.mjs build source/build/release-pages "$PAGES_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_COMMIT: ${{ steps.finalize.outputs.pages_commit }}
      - uses: actions/upload-pages-artifact@v4
        if: steps.finalize.outputs.pages_commit != ''
        with:
          path: source/build/release-pages
      - name: Check that the channel snapshot is still current
        if: steps.finalize.outputs.pages_commit != ''
        run: node tooling/scripts/release-pages.mjs check source/build/release-pages
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/deploy-pages@v4
        if: steps.finalize.outputs.pages_commit != ''
      - name: Verify the public installer and both channels
        if: steps.finalize.outputs.pages_commit != ''
        run: node tooling/scripts/release-pages.mjs verify source/build/release-pages
        env:
          GH_TOKEN: ${{ github.token }}

  legacy-inspect:
    needs: input
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.identity.outputs.environment }}
      commit: ${{ steps.identity.outputs.commit }}
      sha256: ${{ steps.identity.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Node pin from this workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: tooling/.nvmrc
      - name: Download the reviewed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir build/release --pattern '*.tgz' --pattern release.json --pattern SHA256SUMS
      - name: Validate release, artifact, and channel approval policy
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-publish.mjs check

  legacy-publish:
    needs: legacy-inspect
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    # npm-next has no reviewer gate; npm-latest retains required reviewers.
    # Keep both environments for their npm Trusted Publisher OIDC bindings.
    environment: ${{ needs.legacy-inspect.outputs.environment }}
    concurrency:
      group: npm-channel-${{ needs.legacy-inspect.outputs.environment == 'npm-next' && 'next' || 'latest' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.legacy-inspect.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Node pin from this workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: tooling
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: tooling/.nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install the OIDC-capable npm CLI
        run: npm install --global npm@11.11.1 --ignore-scripts
      - name: Download the same release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir build/release --pattern '*.tgz' --pattern release.json --pattern SHA256SUMS
      - name: Revalidate and publish without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.legacy-inspect.outputs.sha256 }}
        run: node scripts/release-publish.mjs publish
