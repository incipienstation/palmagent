name: ci

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      types: ${{ steps.scope.outputs.types }}
      tooling: ${{ steps.scope.outputs.tooling }}
      server: ${{ steps.scope.outputs.server }}
      web: ${{ steps.scope.outputs.web }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select checks from the complete change scope
        id: scope
        run: node scripts/ci-scope.mjs
      - name: Verify repository metadata, skills, links, and public content
        run: |
          node --test scripts/tests/ci-scope.test.mjs scripts/tests/repository-skills.test.mjs
          node scripts/sync-skills.mjs --check
          node scripts/validate.mjs
          node scripts/check-release.mjs

  tooling:
    needs: scope
    if: needs.scope.outputs.types == 'true' || needs.scope.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify types
        if: needs.scope.outputs.types == 'true'
        run: pnpm typecheck
      - name: Verify tooling
        if: needs.scope.outputs.tooling == 'true'
        run: pnpm pkg:check

  server:
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify server contracts and runtime
        run: pnpm server:contracts && pnpm server:smoke

  web:
    needs: scope
    if: needs.scope.outputs.web == 'true' || (needs.scope.outputs.package == 'true' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep browser shards independent from the service-worker runner.
        # Packaging-only changes need one build and no browser shards.
        shard: ${{ fromJSON(needs.scope.outputs.web == 'true' && '[1,2,3,"sw"]' || '[1]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the PWA once per runner
        run: pnpm web:build
      - name: Install Chromium
        if: needs.scope.outputs.web == 'true'
        run: pnpm --filter @palmagent/web exec playwright install --with-deps chromium
      - name: Verify PWA shard
        if: needs.scope.outputs.web == 'true' && matrix.shard != 'sw'
        run: node apps/web/scripts/run-e2e.mjs --shard=${{ matrix.shard }}/3
      - name: Verify service-worker updates once
        if: needs.scope.outputs.web == 'true' && matrix.shard == 'sw'
        run: node apps/web/scripts/test-sw-update.mjs
      - name: Verify packed candidate
        if: needs.scope.outputs.package == 'true' && github.event.pull_request.head.repo.full_name == github.repository && matrix.shard == 1
        env:
          PKG_PUBLISHABLE: '1'
          EXPECT_PUBLISHABLE: '1'
        run: |
          pnpm pkg:assemble
          pnpm release:check --artifact
          node scripts/pkg-smoke.mjs --pack-destination build/candidate

  validate:
    needs: [scope, tooling, server, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          TRUSTED_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: node scripts/ci-results.mjs
