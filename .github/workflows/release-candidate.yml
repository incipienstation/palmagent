name: release candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact source commit; defaults to the selected branch head
        type: string
  workflow_call:
    secrets:
      LEAK_DENYLIST:
        required: true
    inputs:
      commit:
        required: true
        type: string
      candidate_run:
        description: Reuse the immutable candidate from this Actions run
        type: string
        default: ''
    outputs:
      commit:
        value: ${{ jobs.package.outputs.commit }}
      channel:
        value: ${{ jobs.package.outputs.channel }}
      version:
        value: ${{ jobs.package.outputs.version }}
      sha256:
        value: ${{ jobs.package.outputs.sha256 }}
      artifact:
        value: ${{ jobs.package.outputs.artifact }}
      producer:
        value: ${{ jobs.package.outputs.producer }}

permissions:
  contents: read
  actions: read

jobs:
  package:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      channel: ${{ steps.identity.outputs.channel }}
      version: ${{ steps.identity.outputs.version }}
      sha256: ${{ steps.identity.outputs.sha256 }}
      artifact: ${{ steps.artifact.outputs.artifact }}
      producer: ${{ steps.artifact.outputs.producer }}
    env:
      RELEASE_COMMIT: ${{ inputs.commit || github.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out workflow tools
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select immutable candidate storage
        id: artifact
        run: node tooling/scripts/release-candidate.mjs artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run }}
      - name: Check out the exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source identity and channel ancestry
        run: node tooling/scripts/release-candidate.mjs source source
      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.reuse == 'true'
        with:
          name: ${{ steps.artifact.outputs.artifact }}
          run-id: ${{ steps.artifact.outputs.producer }}
          github-token: ${{ github.token }}
          path: source/build/release
      - uses: pnpm/action-setup@v4
        if: steps.artifact.outputs.reuse != 'true'
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v4
        if: steps.artifact.outputs.reuse != 'true'
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install candidate dependencies and Chromium
        if: steps.artifact.outputs.reuse != 'true'
        working-directory: source
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @palmagent/web exec playwright install --with-deps chromium
      - name: Verify and pack the exact candidate
        if: steps.artifact.outputs.reuse != 'true'
        working-directory: source
        run: |
          pnpm verify
          pnpm pkg:assemble
          pnpm release:check --artifact
          node scripts/pkg-smoke.mjs --pack-destination build/release
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          REQUIRE_LEAK_DENYLIST: 'true'
          PKG_PUBLISHABLE: '1'
          EXPECT_PUBLISHABLE: '1'
      - name: Record candidate identity without creating a tag
        if: steps.artifact.outputs.reuse != 'true'
        run: node tooling/scripts/release-candidate.mjs prepare source source/build/release
      - name: Verify the candidate and present the approval evidence
        id: identity
        run: node tooling/scripts/release-candidate.mjs check source source/build/release
        env:
          CANDIDATE_RUN_ID: ${{ steps.artifact.outputs.producer }}
      - uses: actions/upload-artifact@v4
        if: steps.artifact.outputs.reuse != 'true'
        with:
          name: ${{ steps.artifact.outputs.artifact }}
          path: source/build/release/*
          if-no-files-found: error
          retention-days: 90
