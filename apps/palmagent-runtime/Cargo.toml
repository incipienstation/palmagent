[package]
name = "palmagent-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
palmagent-telemetry = { path = "../../packages/native-telemetry" }
anyhow = "1"
axum = "0.8"
libc = "0.2"
form_urlencoded = "1"
percent-encoding = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
base64 = "0.22"

[dev-dependencies]
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
